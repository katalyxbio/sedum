[package]
name = "sedum"
version = "0.1.0"
edition = "2021"
description = "Fast, parallel per-bin depth calculator for BAM/SAM"
license = "MIT"
repository = "https://github.com/katalyxbio/sedum"
publish = false

[package.metadata.dist]
dist = true

# cargo-dist: Linux-only release builds. Private repo, no third-party publishing.
[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
publish-jobs = []
pr-run-mode = "plan"
# Don't try to publish to anything; this is a private repo.
publish-prereleases = false

[features]
default = ["libdeflate"]
# Use libdeflate (SSE2/AVX2-accelerated) for BGZF inflate instead of miniz_oxide.
libdeflate = ["noodles-bgzf/libdeflate"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
noodles-bam = "0.74"
noodles-bgzf = "0.36"
noodles-core = "0.16"
noodles-sam = "0.70"
num_cpus = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false
panic = "abort"

# Profile used by cargo-dist for release artifacts. Inherits from release so
# the binary characteristics match `cargo build --release` locally.
[profile.dist]
inherits = "release"
