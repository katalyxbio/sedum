name: conda

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to upload assets to the GitHub Release on tag builds

jobs:
  build:
    name: rattler-build (linux-64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install rattler-build
        run: |
          curl -L -o rattler-build https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl
          chmod +x rattler-build
          sudo mv rattler-build /usr/local/bin/

      - name: Build package
        env:
          CARGO_BUILD_RUSTFLAGS: ""
        run: |
          rattler-build build --recipe recipe.yaml --output-dir output

      - name: Upload conda package (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sedum-conda-linux-64
          path: output/**/*.conda
          if-no-files-found: error

      - name: Attach conda package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mapfile -t pkgs < <(find output -name '*.conda')
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "no .conda packages found"
            exit 1
          fi
          echo "uploading: ${pkgs[*]} -> release $tag"
          # --clobber so re-runs on the same tag overwrite cleanly.
          gh release upload "$tag" "${pkgs[@]}" --clobber
